# Сборка форка sudden: тесты + подписанный APK (артефакт «apk»)
name: Build sudden

on:
  push:
    branches: [sudden]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Тесты
        run: ./gradlew testGithubReleaseDebugUnitTest
      - name: Ключ подписи
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 --decode > ${{ github.workspace }}/release.p12
      - name: Сборка APK
        run: RELEASE_VERSION_CODE=$((120000 + GITHUB_RUN_NUMBER)) ./gradlew assembleGithubReleaseRelease
        env:
          RELEASE_VERSION_NAME: 0.12.0-s${{ github.run_number }}
          KEYSTORE: ${{ github.workspace }}/release.p12
          KEY_ALIAS: readeck
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASS }}
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/githubRelease/release/*.apk
